name: Android Play Store

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Create Android SPA entry files
        run: |
          cp src/start.ts src/start.ts.original
          cp src/android-entry.tsx src/start.ts
          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="theme-color" content="#0f172a" />
              <title>Deuteronômio 28</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/start.ts"></script>
            </body>
          </html>
          EOF
          cat > vite.android.config.ts <<'EOF'
          import { defineConfig } from "@lovable.dev/vite-tanstack-config";

          export default defineConfig({
            base: "./",
            tanstackStart: {
              server: { entry: "server" },
            },
            build: {
              outDir: "android-dist",
              emptyOutDir: true,
              rollupOptions: { input: "index.html" },
            },
          });
          EOF
      - name: Build Android SPA assets
        run: |
          npm exec vite -- build --config vite.android.config.ts || echo "Vite/TanStack terminou com código não-zero após gerar os assets; validando a saída estática."
          rm -rf www
          mkdir -p www
          cp -R android-dist/. www/
          test -s www/index.html
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
      - name: Build signed AAB
        working-directory: android
        run: ./gradlew bundleRelease -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: culto-ccb-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
